<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:p="http://primefaces.org/ui"
      xmlns:ui="jakarta.faces.facelets"
      lang="fr">

<f:view>

    <h:head>
        <meta charset="UTF-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
        <title>Connexion - Trendio</title>

        <!-- PrimeFaces Theme -->
        <h:outputStylesheet library="primefaces" name="theme.css"/>
        <h:outputStylesheet library="primefaces" name="Bootstrap/bootstrap-purple-light.css"/>

        <!-- Font Awesome -->
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            body {
                font-family: "Poppins", -apple-system, sans-serif;
                background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
                min-height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 20px;
            }

            /* Container principal */
            .login-container {
                background: white;
                border-radius: 30px;
                box-shadow: 0 30px 80px rgba(0, 0, 0, 0.3);
                overflow: hidden;
                max-width: 450px;
                width: 100%;
                animation: slideIn 0.6s ease-out;
            }

            @keyframes slideIn {
                from {
                    opacity: 0;
                    transform: translateY(30px);
                }
                to {
                    opacity: 1;
                    transform: translateY(0);
                }
            }

            /* Header avec gradient */
            .login-header {
                background: linear-gradient(135deg, #9c27b0 0%, #6a1b9a 100%);
                padding: 40px;
                text-align: center;
                position: relative;
                overflow: hidden;
            }

            .login-header::before {
                content: '';
                position: absolute;
                top: -50%;
                right: -50%;
                width: 200%;
                height: 200%;
                background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 70%);
                animation: pulse 3s infinite;
            }

            @keyframes pulse {
                0%, 100% { transform: scale(1); opacity: 1; }
                50% { transform: scale(1.1); opacity: 0.8; }
            }

            .login-header h1 {
                color: white;
                font-size: 2rem;
                font-weight: 700;
                margin-bottom: 10px;
                position: relative;
                z-index: 1;
            }

            .login-header p {
                color: rgba(255, 255, 255, 0.9);
                font-size: 0.95rem;
                position: relative;
                z-index: 1;
            }

            .login-icon {
                width: 80px;
                height: 80px;
                background: white;
                border-radius: 50%;
                display: flex;
                align-items: center;
                justify-content: center;
                margin: 0 auto 20px;
                box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
                position: relative;
                z-index: 1;
            }

            .login-icon i {
                font-size: 2.5rem;
                color: #9c27b0;
            }

            /* Body du formulaire */
            .login-body {
                padding: 40px;
            }

            /* Styling des champs PrimeFaces */
            .login-body .ui-inputfield {
                width: 100% !important;
                padding: 14px 20px !important;
                border: 2px solid #e0e0e0 !important;
                border-radius: 12px !important;
                font-size: 1rem !important;
                transition: all 0.3s ease !important;
                font-family: "Poppins", sans-serif !important;
            }

            .login-body .ui-inputfield:focus {
                border-color: #9c27b0 !important;
                box-shadow: 0 0 0 3px rgba(156, 39, 176, 0.1) !important;
                outline: none !important;
            }

            /* Labels */
            .form-group {
                margin-bottom: 25px;
            }

            .form-group label {
                display: block;
                margin-bottom: 8px;
                color: #2c3e50;
                font-weight: 600;
                font-size: 0.95rem;
            }

            .form-group label i {
                margin-right: 8px;
                color: #9c27b0;
            }

            /* Messages d'erreur */
            .ui-messages {
                margin-bottom: 20px;
                border-radius: 12px !important;
                border: none !important;
                box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1) !important;
            }

            /* Bouton de connexion */
            .login-button {
                width: 100% !important;
                padding: 14px 20px !important;
                background: linear-gradient(135deg, #9c27b0 0%, #6a1b9a 100%) !important;
                border: none !important;
                border-radius: 12px !important;
                color: white !important;
                font-size: 1.1rem !important;
                font-weight: 600 !important;
                cursor: pointer !important;
                transition: all 0.3s ease !important;
                box-shadow: 0 8px 20px rgba(156, 39, 176, 0.3) !important;
                text-transform: uppercase !important;
                letter-spacing: 1px !important;
            }

            .login-button:hover {
                transform: translateY(-2px) !important;
                box-shadow: 0 12px 30px rgba(156, 39, 176, 0.5) !important;
                background: linear-gradient(135deg, #7b1fa2 0%, #4a148c 100%) !important;
            }

            .login-button:active {
                transform: translateY(0) !important;
            }

            .login-button .ui-button-text {
                padding: 0 !important;
            }

            /* Checkbox "Se souvenir" */
            .remember-forgot {
                display: flex;
                justify-content: space-between;
                align-items: center;
                margin-bottom: 25px;
                font-size: 0.9rem;
            }

            .remember-forgot a {
                color: #9c27b0;
                text-decoration: none;
                font-weight: 500;
                transition: color 0.3s ease;
            }

            .remember-forgot a:hover {
                color: #6a1b9a;
                text-decoration: underline;
            }

            /* Séparateur */
            .divider {
                display: flex;
                align-items: center;
                margin: 30px 0;
                color: #999;
                font-size: 0.9rem;
            }

            .divider::before,
            .divider::after {
                content: '';
                flex: 1;
                height: 1px;
                background: #e0e0e0;
            }

            .divider span {
                padding: 0 15px;
            }

            /* Lien d'inscription */
            .signup-link {
                text-align: center;
                margin-top: 25px;
                color: #666;
                font-size: 0.95rem;
            }

            .signup-link a {
                color: #9c27b0;
                font-weight: 600;
                text-decoration: none;
                transition: color 0.3s ease;
            }

            .signup-link a:hover {
                color: #6a1b9a;
                text-decoration: underline;
            }

            /* Bouton retour */
            .back-button {
                display: inline-flex;
                align-items: center;
                gap: 8px;
                color: white;
                text-decoration: none;
                padding: 10px 20px;
                border-radius: 10px;
                background: rgba(255, 255, 255, 0.2);
                transition: all 0.3s ease;
                font-size: 0.9rem;
                margin-bottom: 20px;
            }

            .back-button:hover {
                background: rgba(255, 255, 255, 0.3);
                transform: translateX(-5px);
            }

            /* Responsive */
            @media (max-width: 768px) {
                .login-container {
                    margin: 20px;
                }

                .login-header {
                    padding: 30px 20px;
                }

                .login-header h1 {
                    font-size: 1.5rem;
                }

                .login-body {
                    padding: 30px 20px;
                }

                .remember-forgot {
                    flex-direction: column;
                    gap: 10px;
                    align-items: flex-start;
                }
            }

            /* Animation de chargement */
            .ui-blockui {
                background: rgba(156, 39, 176, 0.1) !important;
            }

            /* Style pour le password avec toggle */
            .password-wrapper {
                position: relative;
            }

            .password-toggle {
                position: absolute;
                right: 15px;
                top: 50%;
                transform: translateY(-50%);
                cursor: pointer;
                color: #999;
                transition: color 0.3s ease;
            }

            .password-toggle:hover {
                color: #9c27b0;
            }
        </style>

    </h:head>

    <h:body>

        <div class="login-container">
            <!-- Header -->
            <div class="login-header">


                <div class="login-icon">
                    <i class="fas fa-user-circle"></i>
                </div>
                <h1>Welcome Back!</h1>
                <p>Sign in to continue to Trendio</p>
            </div>

            <!-- Body avec formulaire -->
            <div class="login-body">
                <h:form id="loginForm">

                    <!-- Messages d'erreur/succès -->
                    <p:messages id="messages" showDetail="true" closable="true">
                        <p:autoUpdate/>
                    </p:messages>

                    <!-- Champ Email -->
                    <div class="form-group">
                        <label for="email">
                            <i class="fas fa-envelope"></i>
                            Email Address
                        </label>
                        <p:inputText id="email"
                                     value="#{authBean.email}"
                                     placeholder="Enter your email"
                                     required="true"
                                     requiredMessage="Email is required"
                                     validatorMessage="Please enter a valid email">
                            <f:validateRegex pattern="^[A-Za-z0-9+_.-]+@(.+)$"/>
                        </p:inputText>
                    </div>

                    <!-- Champ Password -->
                    <div class="form-group">
                        <label for="password">
                            <i class="fas fa-lock"></i>
                            Password
                        </label>
                        <p:password id="password"
                                    value="#{authBean.password}"
                                    placeholder="Enter your password"
                                    required="true"
                                    requiredMessage="Password is required"
                                    feedback="false"
                                    toggleMask="true"
                                    redisplay="true"/>
                    </div>



                    <h:commandButton value="Sign In"
                                     action="#{authBean.login}"
                                     styleClass="login-button" />


                    <!-- Lien d'inscription -->
                    <div class="signup-link">
                        Don't have an account?
                        <h:link outcome="/Internaute/signup" value="Sign up now"/>
                    </div>

                </h:form>
            </div>
        </div>



    </h:body>

</f:view>
</html>
