<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://java.sun.com/jsf/html"
      xmlns:f="http://java.sun.com/jsf/core"
      xmlns:p="http://primefaces.org/ui"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

<h:head>
    <title>Ajouter un Produit</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

    <!-- Font Awesome -->
    <h:outputLink value="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet" type="text/css"/>

    <style>

        /* === CONTAINER === */
        .form-container {
            max-width: 800px;
            margin: 0 auto;
            padding: 0 2rem;
        }

        /* === CARD === */
        .form-card {
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            padding: 3rem;
            animation: fadeInUp 0.5s ease;
        }

        /* === HEADER === */
        .form-header {
            text-align: center;
            margin-bottom: 2.5rem;
            padding-bottom: 1.5rem;
            border-bottom: 3px solid #f0f2f5;
        }

        .form-header h2 {
            font-size: 2rem;
            font-weight: 800;
            color: #2c3e50;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.8rem;
            margin-bottom: 0.5rem;
        }

        .form-header h2 i {
            color: #28a745;
        }

        .form-header p {
            color: #6c757d;
            font-size: 1rem;
            margin-top: 0.5rem;
        }

        /* === MESSAGES === */
        .ui-growl {
            top: 80px !important;
        }

        /* === GRID === */
        .form-grid {
            display: grid;
            gap: 1.5rem;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .form-group-full {
            grid-column: 1 / -1;
        }

        /* === LABELS === */
        .ui-outputlabel {
            font-weight: 700 !important;
            color: #2c3e50 !important;
            font-size: 0.95rem !important;
            display: flex;
            align-items: center;
            gap: 0.3rem;
        }

        .required-mark {
            color: #dc3545;
            font-weight: 700;
        }

        /* === INPUTS === */
        .ui-inputfield,
        .ui-inputtext,
        .ui-inputnumber input,
        .ui-inputtextarea {
            width: 100% !important;
            padding: 0.9rem 1rem !important;
            border: 2px solid #e9ecef !important;
            border-radius: 10px !important;
            font-size: 0.95rem !important;
            transition: all 0.3s ease !important;
            color: #2c3e50 !important;
        }

        .ui-inputfield:focus,
        .ui-inputtext:focus,
        .ui-inputnumber input:focus,
        .ui-inputtextarea:focus {
            border-color: #28a745 !important;
            box-shadow: 0 0 0 3px rgba(40, 167, 69, 0.1) !important;
            outline: none !important;
        }

        .ui-inputtextarea {
            resize: vertical;
            min-height: 100px !important;
        }

        /* === FILE UPLOAD === */
        .ui-fileupload {
            border: 2px dashed #e9ecef !important;
            border-radius: 10px !important;
            padding: 1.5rem !important;
            background: #f8f9fa !important;
            transition: all 0.3s ease !important;
        }

        .ui-fileupload:hover {
            border-color: #28a745 !important;
            background: #f0fdf4 !important;
        }

        .ui-fileupload-buttonbar {
            background: transparent !important;
            border: none !important;
            padding: 0 !important;
        }

        .ui-fileupload .ui-button {
            background: #28a745 !important;
            border: none !important;
            border-radius: 8px !important;
            padding: 0.7rem 1.2rem !important;
            font-weight: 600 !important;
        }

        .upload-hint {
            display: block;
            margin-top: 0.5rem;
            color: #6c757d;
            font-size: 0.85rem;
            font-style: italic;
        }

        /* === BUTTONS === */
        .button-group {
            display: flex;
            gap: 1rem;
            margin-top: 2rem;
            padding-top: 2rem;
            border-top: 2px solid #f0f2f5;
        }

        .ui-button {
            padding: 0.9rem 2rem !important;
            border-radius: 12px !important;
            font-weight: 700 !important;
            font-size: 1rem !important;
            transition: all 0.3s ease !important;
            display: inline-flex !important;
            align-items: center !important;
            gap: 0.6rem !important;
            border: none !important;
        }

        .p-button-success {
            background: linear-gradient(135deg, #28a745 0%, #218838 100%) !important;
            color: white !important;
            box-shadow: 0 6px 20px rgba(40, 167, 69, 0.3) !important;
            flex: 1;
        }

        .p-button-success:hover {
            background: linear-gradient(135deg, #218838 0%, #1e7e34 100%) !important;
            transform: translateY(-3px) !important;
            box-shadow: 0 10px 30px rgba(40, 167, 69, 0.4) !important;
        }

        .p-button-secondary {
            background: #6c757d !important;
            color: white !important;
            box-shadow: 0 4px 15px rgba(108, 117, 125, 0.3) !important;
        }

        .p-button-secondary:hover {
            background: #5a6268 !important;
            transform: translateY(-3px) !important;
            box-shadow: 0 8px 25px rgba(108, 117, 125, 0.4) !important;
        }

        /* === ICONS IN LABELS === */
        .label-icon {
            color: #6c757d;
            font-size: 0.9rem;
        }

        /* === ANIMATIONS === */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* === RESPONSIVE === */
        @media (max-width: 768px) {
            body {
                padding: 1rem 0;
            }

            .form-container {
                padding: 0 1rem;
            }

            .form-card {
                padding: 2rem 1.5rem;
            }

            .form-header h2 {
                font-size: 1.6rem;
            }

            .form-row {
                grid-template-columns: 1fr;
                gap: 1.5rem;
            }

            .button-group {
                flex-direction: column;
            }
        }

        /* === HELPER TEXT === */
        .helper-text {
            font-size: 0.85rem;
            color: #6c757d;
            margin-top: 0.3rem;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .helper-text i {
            color: #17a2b8;
        }

        /* === INPUT NUMBER BUTTONS === */
        .ui-inputnumber-button {
            background: #f8f9fa !important;
            border: 1px solid #e9ecef !important;
            color: #6c757d !important;
        }

        .ui-inputnumber-button:hover {
            background: #e9ecef !important;
        }
    </style>
</h:head>

<h:body>
    <!-- Inclure la navbar -->
    <ui:include src="/navbar.xhtml"/>

    <div class="form-container">
        <div class="form-card">
            <!-- Header -->
            <div class="form-header">
                <h2>
                    <i class="fas fa-plus-circle"></i>
                    Ajouter un Produit
                </h2>
                <p>Remplissez tous les champs obligatoires pour ajouter un nouveau produit</p>
            </div>

            <!-- Messages -->
            <p:growl id="messages" showDetail="true" life="4000"/>

            <!-- Form -->
            <h:form id="form" enctype="multipart/form-data">
                <div class="form-grid">
                    <!-- Désignation -->
                    <div class="form-group form-group-full">
                        <p:outputLabel for="designation">
                            <i class="fas fa-tag label-icon"></i>
                            Désignation
                            <span class="required-mark">*</span>
                        </p:outputLabel>
                        <p:inputText id="designation"
                                     value="#{produitBean.newProduit.designation}"
                                     required="true"
                                     placeholder="Ex: iPhone 15 Pro Max"/>
                    </div>

                    <!-- Prix et Stock -->
                    <div class="form-row">
                        <div class="form-group">
                            <p:outputLabel for="prix">
                                <i class="fas fa-money-bill-wave label-icon"></i>
                                Prix (DH)
                                <span class="required-mark">*</span>
                            </p:outputLabel>
                            <p:inputNumber id="prix"
                                           value="#{produitBean.newProduit.prixUnitaire}"
                                           required="true"
                                           minValue="0"
                                           mode="decimal"
                                           minFractionDigits="2"
                                           placeholder="0.00"/>
                            <span class="helper-text">
                                <i class="fas fa-info-circle"></i>
                                Prix unitaire en dirhams
                            </span>
                        </div>

                        <div class="form-group">
                            <p:outputLabel for="stock">
                                <i class="fas fa-warehouse label-icon"></i>
                                Stock
                                <span class="required-mark">*</span>
                            </p:outputLabel>
                            <p:inputNumber id="stock"
                                           value="#{produitBean.newProduit.stock}"
                                           required="true"
                                           minValue="0"
                                           decimalPlaces="0"
                                           placeholder="0"/>
                            <span class="helper-text">
                                <i class="fas fa-info-circle"></i>
                                Quantité disponible
                            </span>
                        </div>
                    </div>

                    <!-- Description -->
                    <div class="form-group form-group-full">
                        <p:outputLabel for="description">
                            <i class="fas fa-align-left label-icon"></i>
                            Description
                            <span class="required-mark">*</span>
                        </p:outputLabel>
                        <p:inputTextarea id="description"
                                         value="#{produitBean.newProduit.description}"
                                         required="true"
                                         rows="4"
                                         placeholder="Décrivez les caractéristiques et avantages du produit..."/>
                    </div>

                    <!-- Image Upload -->
                    <div class="form-group form-group-full">
                        <p:outputLabel for="image">
                            <i class="fas fa-image label-icon"></i>
                            Image du produit
                        </p:outputLabel>
                        <p:fileUpload id="image"
                                      value="#{produitBean.uploadedFile}"
                                      mode="simple"
                                      skinSimple="true"
                                      chooseLabel="📁 Choisir une image"/>
                        <small class="upload-hint">
                            <i class="fas fa-info-circle"></i>
                            Formats acceptés: JPG, PNG, GIF • Taille maximale: 1MB
                        </small>
                    </div>

                    <!-- Buttons -->
                    <div class="button-group form-group-full">
                        <p:commandButton value="Ajouter le produit"
                                         action="#{produitBean.ajouterProduit}"
                                         icon="pi pi-check"
                                         styleClass="p-button-success"
                                         update="messages"
                                         process="@form"/>

                        <p:button value="Annuler"
                                  outcome="List.xhtml"
                                  icon="pi pi-times"
                                  styleClass="p-button-secondary"/>
                    </div>
                </div>
            </h:form>
        </div>
    </div>
</h:body>
</html>
